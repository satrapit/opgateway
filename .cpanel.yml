---
# Only these public entrypoint files may be deployed into the document root.
# Never copy the repository root, .env, .git, src, tests, or storage.
deployment:
  tasks:
    - export DEPLOYPATH=/home/arsamnet/opgateway.arsamnet.com
    - /bin/test -d "$DEPLOYPATH"
    - /bin/test -f public/index.php
    - /bin/test -f public/.htaccess
    - /bin/cp -f public/index.php "$DEPLOYPATH/index.php"
    - /bin/cp -f public/.htaccess "$DEPLOYPATH/.htaccess"
