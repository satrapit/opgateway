---
# Manual cPanel Git Version Control deployment only; never run Composer or NPM.
# Private vendor/, src/, templates/, frontend/, storage/, secrets and Git stay
# outside the document root. Existing cPanel .htaccess/php.ini are untouched.
deployment:
  tasks:
    - export DEPLOYPATH=/home/arsamnet/opgateway.arsamnet.com
    - /bin/test -d "$DEPLOYPATH"
    - /bin/test -f "$DEPLOYPATH/.htaccess"
    - /bin/test -f public/index.php
    - /bin/test ! -L public/index.php
    - /bin/test ! -L "$DEPLOYPATH/index.php"
    - /bin/test -f public/assets/admin.css
    - /bin/test -f public/assets/admin.js
    - /bin/test -f public/assets/theme-init.js
    - /bin/test ! -L public/assets
    - /bin/test ! -L public/assets/admin.css
    - /bin/test ! -L public/assets/admin.js
    - /bin/test ! -L public/assets/theme-init.js
    - /bin/test ! -L "$DEPLOYPATH/assets"
    - /bin/mkdir -p "$DEPLOYPATH/assets"
    - /bin/test ! -L "$DEPLOYPATH/assets/admin.css"
    - /bin/test ! -L "$DEPLOYPATH/assets/admin.js"
    - /bin/test ! -L "$DEPLOYPATH/assets/theme-init.js"
    - /bin/cp -f public/assets/admin.css "$DEPLOYPATH/assets/admin.css"
    - /bin/cp -f public/assets/admin.js "$DEPLOYPATH/assets/admin.js"
    - /bin/cp -f public/assets/theme-init.js "$DEPLOYPATH/assets/theme-init.js"
    - /bin/cp -f public/index.php "$DEPLOYPATH/index.php"
